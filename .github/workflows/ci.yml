name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==20.1.8"
          clang-format --version
      - name: Check formatting
        run: python scripts/format_source.py --check

  protocol-tests:
    name: protocol + tab_strip (no Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: MultiProcessShell
      - name: Checkout AbseilPin
        uses: actions/checkout@v7
        with:
          repository: yanxijian/AbseilPin
          path: AbseilPin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Python protobuf
        working-directory: MultiProcessShell
        run: python -m pip install -r clients/python/requirements.txt
      - name: Cache AbseilPin prefix
        uses: actions/cache@v6
        id: abseil-pin
        with:
          path: AbseilPin/prefix/20260107.1
          key: abseil-pin-20260107.1-linux-${{ hashFiles('AbseilPin/CMakeLists.txt', 'AbseilPin/scripts/build_pin.ps1', 'AbseilPin/pins/20260107.1/**') }}
      - name: Build AbseilPin 20260107.1
        if: steps.abseil-pin.outputs.cache-hit != 'true'
        working-directory: AbseilPin
        run: |
          cmake -S . -B build/20260107.1 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DABSL_PIN_ID=20260107.1 \
            -DCMAKE_INSTALL_PREFIX=prefix/20260107.1
          cmake --build build/20260107.1
          cmake --install build/20260107.1
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: MultiProcessShell/build/_deps
          key: mps-deps-ubuntu-pin-${{ hashFiles('MultiProcessShell/cmake/**', 'MultiProcessShell/CMakeLists.txt', 'MultiProcessShell/src/common/CMakeLists.txt') }}
      - name: Configure (tests only)
        working-directory: MultiProcessShell
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPS_FETCH_PROTOBUF=ON \
            -DMPS_ABSEIL_PIN_PREFIX=${{ github.workspace }}/AbseilPin/prefix/20260107.1 \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DMPS_BUILD_TESTS=ON \
            -DMPS_BUILD_DEMOS=OFF \
            -DMPS_BUILD_SRC=OFF
      - name: Build
        working-directory: MultiProcessShell
        run: cmake --build build --config Release
      - name: Test
        working-directory: MultiProcessShell
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows-qt:
    name: Windows MSVC + Qt (Demo + tests)
    runs-on: windows-latest
    steps:
      - name: Checkout MultiProcessShell
        uses: actions/checkout@v7
        with:
          path: MultiProcessShell
      - name: Checkout QThemeEngine (sibling for Demo Client)
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QThemeEngine
          path: QThemeEngine
      - name: Checkout QFluentRibbon (sibling for Demo Client)
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QFluentRibbon
          path: QFluentRibbon
      - name: Checkout AbseilPin
        uses: actions/checkout@v7
        with:
          repository: yanxijian/AbseilPin
          path: AbseilPin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Install Python protobuf
        working-directory: MultiProcessShell
        run: python -m pip install -r clients/python/requirements.txt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          arch: win64_msvc2022_64
      - name: Cache AbseilPin prefix
        uses: actions/cache@v6
        id: abseil-pin
        with:
          path: AbseilPin/prefix/20260107.1
          key: abseil-pin-20260107.1-win-${{ hashFiles('AbseilPin/CMakeLists.txt', 'AbseilPin/scripts/build_pin.ps1', 'AbseilPin/pins/20260107.1/**') }}
      - name: Build AbseilPin 20260107.1
        if: steps.abseil-pin.outputs.cache-hit != 'true'
        working-directory: AbseilPin
        shell: pwsh
        run: |
          ./scripts/build_pin.ps1 -Pin 20260107.1
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: MultiProcessShell/build-shared/_deps
          key: mps-deps-win-pin-${{ hashFiles('MultiProcessShell/cmake/**', 'MultiProcessShell/CMakeLists.txt', 'MultiProcessShell/src/common/CMakeLists.txt') }}
      - name: Build and test
        working-directory: MultiProcessShell
        shell: cmd
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: |
          where cl
          where ninja
          python scripts\build_repo.py --test -D MPS_DEV_EMBED_QTE=ON -D MPS_DEV_EMBED_QFR=ON -D MPS_INSTALL=OFF -D MPS_ABSEIL_PIN_PREFIX=%GITHUB_WORKSPACE%/AbseilPin/prefix/20260107.1
      - name: Verify single pin abseil beside demos
        working-directory: MultiProcessShell
        shell: pwsh
        run: |
          $pin = Join-Path $env:GITHUB_WORKSPACE "AbseilPin/prefix/20260107.1/bin/abseil_dll.dll"
          $bin = Join-Path (Get-Location) "build-shared/bin"
          if (-not (Test-Path $bin)) { $bin = Join-Path (Get-Location) "build-shared/demos" }
          $hits = @(Get-ChildItem -Path (Join-Path (Get-Location) "build-shared") -Recurse -Filter abseil_dll.dll -File -ErrorAction SilentlyContinue)
          if ($hits.Count -lt 1) { throw "abseil_dll.dll not found under build-shared" }
          $pinHash = (Get-FileHash $pin -Algorithm SHA256).Hash
          foreach ($h in $hits) {
            $hh = (Get-FileHash $h.FullName -Algorithm SHA256).Hash
            if ($hh -ne $pinHash) { throw "abseil mismatch: $($h.FullName)" }
          }
          Write-Host "OK $($hits.Count) abseil_dll.dll file(s) match AbseilPin"
